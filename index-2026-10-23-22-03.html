<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Theo Armour ~ decades of repositories, organizations and ideas, gathered onto one shelf">
<meta name="revised" content="2026-10-23 21:55">
<title>Theo Armour ~ The Shelf</title>
<link rel="icon" href="favicon.ico">

<style>
	:root {
		--color-bg: #faf6ef;
		--color-text: #2b2520;
		--color-text-soft: #6f655a;
		--color-shelf: #8a6a4b;
		--color-shelf-edge: #6e5239;
		--color-card: #ffffff;
		--color-card-border: #e4dbcc;
		--color-panel: #f3ecdf;
		--color-accent: #b5542d;
		--color-badge-repo: #3b6e8f;
		--color-badge-org: #7a5c9e;
		--color-badge-fork: #7d8a4d;
		--shadow-card: 0 1px 3px rgba(60, 45, 30, 0.15);
		--shadow-card-hover: 0 6px 16px rgba(60, 45, 30, 0.25);
		--space: 1rem;
		--radius: 8px;
	}

	@media (prefers-color-scheme: dark) {
		:root {
			--color-bg: #221d18;
			--color-text: #ece5da;
			--color-text-soft: #a99d8e;
			--color-shelf: #5d4631;
			--color-shelf-edge: #483623;
			--color-card: #2e2822;
			--color-card-border: #443b31;
			--color-panel: #2a241e;
			--color-accent: #e08050;
			--shadow-card: 0 1px 3px rgba(0, 0, 0, 0.4);
			--shadow-card-hover: 0 6px 16px rgba(0, 0, 0, 0.55);
		}
	}

	* { box-sizing: border-box; }

	body {
		background: var(--color-bg);
		color: var(--color-text);
		font-family: Georgia, "Times New Roman", serif;
		line-height: 1.5;
		margin: 0 auto;
		max-width: 72rem;
		padding: 0 var(--space);
	}

	header {
		padding: 3rem 0 1rem;
		text-align: center;
	}

	h1 {
		font-size: 2.6rem;
		letter-spacing: 0.02em;
		margin: 0;
	}

	.tagline {
		color: var(--color-text-soft);
		font-size: 1.15rem;
		font-style: italic;
		margin: 0.5rem 0 1rem;
	}

	.links {
		display: flex;
		flex-wrap: wrap;
		gap: 0.4rem 1rem;
		justify-content: center;
		font-family: system-ui, sans-serif;
		font-size: 0.85rem;
	}

	.links a {
		color: var(--color-accent);
		text-decoration: none;
	}

	.links a:hover { text-decoration: underline; }

	.summary {
		color: var(--color-text-soft);
		font-family: system-ui, sans-serif;
		font-size: 0.85rem;
		margin-top: 1rem;
	}

	h2 {
		font-size: 1.4rem;
		font-weight: normal;
		margin: 3rem 0 0.2rem;
	}

	h2 .era-years {
		color: var(--color-text-soft);
		font-family: system-ui, sans-serif;
		font-size: 0.8rem;
		margin-left: 0.75rem;
	}

	/* ~ a row of material standing on a wooden shelf board ~ */
	.shelf {
		display: flex;
		flex-wrap: wrap;
		gap: 0.6rem;
		align-items: flex-end;
		border-bottom: 10px solid var(--color-shelf);
		box-shadow: 0 12px 0 -4px var(--color-shelf-edge);
		padding: 1rem 0.5rem 0;
		margin-bottom: 1.5rem;
	}

	.spine, .face-out {
		background: var(--color-card);
		border: 1px solid var(--color-card-border);
		border-radius: var(--radius) var(--radius) 0 0;
		box-shadow: var(--shadow-card);
		color: inherit;
		display: block;
		text-decoration: none;
		transition: transform 0.15s ease, box-shadow 0.15s ease;
	}

	.spine:hover, .face-out:hover {
		box-shadow: var(--shadow-card-hover);
		transform: translateY(-6px);
	}

	/* narrow book spines for the complete index */
	.spine {
		padding: 0.6rem 0.55rem 0.8rem;
		width: 8.6rem;
		min-height: 11rem;
		display: flex;
		flex-direction: column;
	}

	.spine-name {
		font-family: system-ui, sans-serif;
		font-size: 0.92rem;
		font-weight: 600;
		overflow-wrap: break-word;
	}

	.spine-desc {
		color: var(--color-text-soft);
		font-size: 0.78rem;
		flex-grow: 1;
		margin: 0.35rem 0;
		overflow: hidden;
	}

	.spine-foot {
		color: var(--color-text-soft);
		font-family: system-ui, sans-serif;
		font-size: 0.72rem;
		display: flex;
		justify-content: space-between;
		gap: 0.3rem;
	}

	.spine-name a {
		color: inherit;
		text-decoration: none;
	}

	.spine-name a:hover { color: var(--color-accent); }

	.repos-toggle {
		background: none;
		border: none;
		color: var(--color-accent);
		cursor: pointer;
		font-family: system-ui, sans-serif;
		font-size: 0.72rem;
		padding: 0;
	}

	.repos-toggle:hover { text-decoration: underline; }

	/* ~ a drawer that opens below the shelf showing one org's repos ~ */
	.org-panel {
		background: var(--color-panel);
		border: 1px solid var(--color-card-border);
		border-radius: var(--radius);
		margin: -0.5rem 0 2rem;
		padding: 0.9rem 1rem 1.1rem;
	}

	.org-panel-title {
		font-family: system-ui, sans-serif;
		font-size: 0.9rem;
		margin: 0;
	}

	.org-panel-title a {
		color: var(--color-accent);
		text-decoration: none;
	}

	.org-panel-shelf {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
		margin-top: 0.7rem;
	}

	.spine.mini {
		border-radius: var(--radius);
		min-height: 7rem;
		padding: 0.5rem;
		width: 7.6rem;
	}

	.spine.mini .spine-name { font-size: 0.8rem; }
	.spine.mini .spine-desc { font-size: 0.7rem; }

	/* wide face-out cards for today's picks */
	.face-out {
		padding: 1rem 1.1rem 1.2rem;
		width: 17rem;
	}

	.face-out .spine-name { font-size: 1.1rem; }

	.face-out .note {
		border-left: 3px solid var(--color-accent);
		color: var(--color-text);
		font-size: 0.9rem;
		font-style: italic;
		margin: 0.6rem 0 0.4rem;
		padding-left: 0.6rem;
	}

	.badge {
		border-radius: 4px;
		color: #fff;
		display: inline-block;
		font-family: system-ui, sans-serif;
		font-size: 0.62rem;
		font-weight: 600;
		letter-spacing: 0.05em;
		margin-bottom: 0.4rem;
		padding: 0.1rem 0.45rem;
		text-transform: uppercase;
		width: fit-content;
	}

	.badge-repo { background: var(--color-badge-repo); }
	.badge-org { background: var(--color-badge-org); }
	.badge-fork { background: var(--color-badge-fork); }

	footer {
		color: var(--color-text-soft);
		font-family: system-ui, sans-serif;
		font-size: 0.8rem;
		padding: 3rem 0 2rem;
		text-align: center;
	}

	footer a { color: var(--color-accent); }

	@media (max-width: 480px) {
		h1 { font-size: 2rem; }
		.spine { width: calc(50% - 0.3rem); min-height: 9rem; }
		.face-out { width: 100%; }
		.spine.mini { width: calc(50% - 0.25rem); min-height: 7rem; }
	}
</style>
</head>

<body>

<header>
	<h1>🗄️ Theo Armour</h1>
	<p class="tagline">Former architect, perpetual software developer, lifelong learner.<br>
		Decades of repositories, organizations and ideas ~ gathered onto one shelf.</p>
	<nav class="links" id="linksNav"></nav>
	<p class="summary" id="summaryLine">Loading the shelf&hellip;</p>
</header>

<main id="shelves"></main>

<footer id="pageFooter"></footer>

<script src="ta-data.js"></script>
<script>

// ~ one object holds the page state ~
const state = {
	entries: [],
	meta: {},
};

// ~ edit these freely: outside links shown under the title ~
const profileLinks = [
	{ text: "GitHub", url: "https://github.com/theo-armour" },
	{ text: "X", url: "https://x.com/ta" },
	{ text: "Instagram", url: "https://www.instagram.com/armour.theo/" },
	{ text: "LinkedIn", url: "https://www.linkedin.com/in/theoa/" },
	{ text: "Reddit", url: "https://www.reddit.com/user/theo/" },
	{ text: "Substack", url: "https://substack.com/@theoarmour" },
	{ text: "Medium", url: "https://medium.com/@ta" },
	{ text: "YouTube", url: "https://www.youtube.com/@theoarmour" },
	{ text: "Telegram", url: "https://t.me/theo_armour" },
	{ text: "Heritage on the Marina", url: "https://heritageonthemarina.org/" },
];

// ~ edit these freely: the shelves, oldest era first ~
const eras = [
	{ from: 2010, to: 2013, title: "Flight simulators & first 3D" },
	{ from: 2014, to: 2017, title: "Buildings, data & a flock of orgs" },
	{ from: 2018, to: 2021, title: "Remembering to live" },
	{ from: 2022, to: 2030, title: "Gathering it all together" },
];

const badges = {
	repo: { label: "repo", emoji: "📦" },
	org: { label: "org", emoji: "🏛️" },
	fork: { label: "fork", emoji: "🍴" },
};

init();

function init () {

	renderLinks();

	if ( typeof TA_DATA === "undefined" ) {

		document.getElementById( "summaryLine" ).textContent =
			"Could not load ta-data.js ~ is the file next to index.html?";
		return;

	}

	state.meta = TA_DATA.meta;
	state.entries = TA_DATA.entries;
	renderPage();

}

function renderLinks () {

	const html = profileLinks.map( link =>
		`<a href="${ link.url }">${ link.text }</a>`
	).join( "" );

	document.getElementById( "linksNav" ).innerHTML = html;

}

function renderPage () {

	renderSummary();

	const picks = state.entries.filter( entry => entry.pick );
	const shelvesHtml = [];

	if ( picks.length ) {

		shelvesHtml.push( `<h2>⭐ Face out ~ today's picks</h2>` );
		shelvesHtml.push( `<div class="shelf">${ picks.map( renderFaceOut ).join( "" ) }</div>` );

	}

	for ( const era of eras ) {

		const items = state.entries.filter( entry => {

			const year = Number( entry.created.slice( 0, 4 ) );
			return year >= era.from && year <= era.to;

		} );

		if ( !items.length ) { continue; }

		const toYear = Math.min( era.to, new Date().getFullYear() );
		shelvesHtml.push( `<h2>${ era.title }<span class="era-years">${ era.from }–${ toYear }</span></h2>` );
		shelvesHtml.push( `<div class="shelf">${ items.map( renderSpine ).join( "" ) }</div>` );

	}

	document.getElementById( "shelves" ).innerHTML = shelvesHtml.join( "\n" );

	renderFooter();

}

function renderSummary () {

	const counts = { repo: 0, org: 0, fork: 0 };
	state.entries.forEach( entry => counts[ entry.type ]++ );

	const years = state.entries.map( entry => entry.created.slice( 0, 4 ) );

	const orgRepoTotal = state.entries
		.filter( entry => entry.type === "org" )
		.reduce( ( sum, entry ) => sum + ( entry.repoList ? entry.repoList.length : 0 ), 0 );

	document.getElementById( "summaryLine" ).textContent =
		`${ counts.repo } repositories · ${ counts.org } organizations holding ${ orgRepoTotal } more · ` +
		`${ counts.fork } forks · ${ Math.min( ...years ) } to ${ Math.max( ...years ) }`;

}

function renderBadge ( entry ) {

	const badge = badges[ entry.type ];
	return `<span class="badge badge-${ entry.type }">${ badge.emoji } ${ badge.label }</span>`;

}

function renderMetaFoot ( entry ) {

	const extra = entry.type === "org"
		? `${ entry.repos } repos`
		: ( entry.stars ? `★ ${ entry.stars }` : "" );

	return `<div class="spine-foot"><span>${ entry.created.slice( 0, 4 ) }</span><span>${ extra }</span></div>`;

}

function renderSpine ( entry ) {

	if ( entry.type === "org" && entry.repoList?.length ) { return renderOrgCard( entry, "spine" ); }

	return `<a class="spine" href="${ entry.url }" title="${ escapeHtml( entry.description ) }">
		${ renderBadge( entry ) }
		<div class="spine-name">${ entry.name }</div>
		<div class="spine-desc">${ escapeHtml( entry.description ) }</div>
		${ renderMetaFoot( entry ) }
	</a>`;

}

function renderFaceOut ( entry ) {

	if ( entry.type === "org" && entry.repoList?.length ) { return renderOrgCard( entry, "face-out" ); }

	const note = entry.note ? `<div class="note">${ escapeHtml( entry.note ) }</div>` : "";

	return `<a class="face-out" href="${ entry.url }">
		${ renderBadge( entry ) }
		<div class="spine-name">${ entry.name }</div>
		<div class="spine-desc">${ escapeHtml( entry.description ) }</div>
		${ note }
		${ renderMetaFoot( entry ) }
	</a>`;

}

// ~ an org card: name links to GitHub, the repo count opens a drawer of its repos ~
function renderOrgCard ( entry, cardClass ) {

	const note = ( cardClass === "face-out" && entry.note ) ? `<div class="note">${ escapeHtml( entry.note ) }</div>` : "";

	return `<div class="${ cardClass }">
		${ renderBadge( entry ) }
		<div class="spine-name"><a href="${ entry.url }">${ entry.name }</a></div>
		<div class="spine-desc">${ escapeHtml( entry.description ) }</div>
		${ note }
		<div class="spine-foot">
			<span>${ entry.created.slice( 0, 4 ) }</span>
			<button class="repos-toggle" data-org="${ entry.name }">📦 ${ entry.repoList.length } repos ▾</button>
		</div>
	</div>`;

}

function renderOrgPanel ( entry ) {

	const spines = entry.repoList.map( repo =>
		`<a class="spine mini" href="${ repo.url }" title="${ escapeHtml( repo.description ) }">
			<div class="spine-name">${ repo.name }</div>
			<div class="spine-desc">${ escapeHtml( repo.description ) }</div>
			<div class="spine-foot"><span>${ repo.updated.slice( 0, 4 ) }</span><span>${ repo.stars ? "★ " + repo.stars : "" }</span></div>
		</a>`
	).join( "" );

	return `<div class="org-panel" data-org="${ entry.name }">
		<p class="org-panel-title">🏛️ <a href="${ entry.url }">${ entry.name }</a> ~ ${ entry.repoList.length } repositories, most recently active first</p>
		<div class="org-panel-shelf">${ spines }</div>
	</div>`;

}

function onShelvesClick ( event ) {

	const button = event.target.closest( ".repos-toggle" );
	if ( !button ) { return; }

	const shelf = button.closest( ".shelf" );
	const open = shelf.nextElementSibling;
	const isOpenPanel = open && open.classList.contains( "org-panel" );
	const isSamePanel = isOpenPanel && open.dataset.org === button.dataset.org;

	if ( isOpenPanel ) { open.remove(); }
	if ( isSamePanel ) { return; }

	const entry = state.entries.find( item => item.type === "org" && item.name === button.dataset.org );
	shelf.insertAdjacentHTML( "afterend", renderOrgPanel( entry ) );

}

function renderFooter () {

	document.getElementById( "pageFooter" ).innerHTML =
		`Snapshot of <a href="ta-data.js">ta-data.js</a> taken ${ state.meta.snapshot } · ` +
		`refreshed by agent, curated by Theo · ` +
		`<a href="https://github.com/theo-armour/2026-ta-gh-io-refactor">source</a>`;

}

function escapeHtml ( text ) {

	return String( text ?? "" )
		.replaceAll( "&", "&amp;" )
		.replaceAll( "<", "&lt;" )
		.replaceAll( ">", "&gt;" )
		.replaceAll( '"', "&quot;" );

}

document.getElementById( "shelves" ).addEventListener( "click", onShelvesClick );

</script>

</body>
</html>
